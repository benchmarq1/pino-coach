name: Android APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android-SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME)
      - name: Android-SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Inhalte in das Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pino-coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pino-coach-apk
          path: pino-coach.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pino-Coach Build ${{ github.run_number }}
          make_latest: true
          files: pino-coach.apk
          body: |
            Debug-APK zum Testen. Auf dem Handy herunterladen und installieren
            (Installation aus unbekannten Quellen erlauben).
